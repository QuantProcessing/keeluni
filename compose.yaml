# docker compose up -d --build --force-recreate
#
# The trader password is printed once in the trader log on first start:
#   docker compose logs trader | grep password
# Only 127.0.0.1:8080 is published. The gateway, hedger and Postgres are
# reachable only inside the compose network. App state lives in the
# keeluni-data volume; Postgres data in keeluni-pg. The project and volume
# names are fixed here so they do not depend on the checkout directory.
#
# Venues behind a proxy: set KEELUNI_PROXY, e.g. http://host.docker.internal:7892
#
# Apps that need a database each get their own role and database on the one
# Postgres (see hedger-initdb); the admin password never leaves the
# postgres-secrets directory.

name: keeluni

x-common: &common
  image: keeluni:latest
  build: .
  pull_policy: build
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  gateway:
    <<: *common
    entrypoint: ["/usr/local/bin/gateway"]
    environment:
      GATEWAY_ADDR: 0.0.0.0:8081
      GATEWAY_DATA_DIR: /data/gateway
      HTTPS_PROXY: ${KEELUNI_PROXY:-}
      HTTP_PROXY: ${KEELUNI_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,gateway,trader,hedger,optioner,postgres
    volumes:
      - keeluni-data:/data
    networks: [internal]

  trader:
    <<: *common
    entrypoint: ["/usr/local/bin/trader"]
    depends_on: [gateway]
    environment:
      TRADER_ADDR: 0.0.0.0:8080
      TRADER_DATA_DIR: /data/trader
      GATEWAY_URL: http://gateway:8081
      GATEWAY_TOKEN_FILE: /data/gateway/token
      # Remove these two lines to run the trader without the hedge app.
      HEDGER_URL: http://hedger:8082
      HEDGER_TOKEN_FILE: /data/hedger/token
      # Remove these two lines to run the trader without the options app.
      OPTIONER_URL: http://optioner:8083
      OPTIONER_TOKEN_FILE: /data/optioner/token
    volumes:
      - keeluni-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal]

  # One Postgres for every app that needs a database. The superuser password
  # is generated once into the postgres-secrets volume (pg-secret), which only
  # Postgres and the per-app initdb jobs mount.
  # Readable by postgres (owner) and by app initdb jobs (group 65532), nobody else.
  pg-secret:
    image: postgres:17-alpine
    restart: "no"
    network_mode: none
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        test -s /secrets/admin.password || (umask 077; head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /secrets/admin.password)
        chown postgres:65532 /secrets/admin.password
        chmod 640 /secrets/admin.password
    volumes:
      - postgres-secrets:/secrets

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      pg-secret: { condition: service_completed_successfully }
    environment:
      POSTGRES_PASSWORD_FILE: /secrets/admin.password
    volumes:
      - keeluni-pg:/var/lib/postgresql/data
      - postgres-secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]

  # Creates the hedger role and database once, and writes the hedger's own
  # connection URL to /data/hedger/database.url (0600). Idempotent.
  hedger-initdb:
    <<: *common
    restart: "no"
    entrypoint: ["/usr/local/bin/hedger", "initdb"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      HEDGER_DATA_DIR: /data/hedger
      POSTGRES_HOST: postgres:5432
      POSTGRES_ADMIN_PASSWORD_FILE: /secrets/admin.password
    volumes:
      - keeluni-data:/data
      - postgres-secrets:/secrets:ro
    networks: [internal]

  hedger:
    <<: *common
    entrypoint: ["/usr/local/bin/hedger"]
    depends_on:
      gateway: { condition: service_started }
      hedger-initdb: { condition: service_completed_successfully }
    environment:
      HEDGER_ADDR: 0.0.0.0:8082
      HEDGER_DATA_DIR: /data/hedger
      GATEWAY_URL: http://gateway:8081
      GATEWAY_TOKEN_FILE: /data/gateway/token
    volumes:
      - keeluni-data:/data
    networks: [internal]

  # The options app: risk across options accounts and multi-leg execution.
  # No database: positions are read live from the venues through the gateway.
  optioner:
    <<: *common
    entrypoint: ["/usr/local/bin/optioner"]
    depends_on: [gateway]
    environment:
      OPTIONER_ADDR: 0.0.0.0:8083
      OPTIONER_DATA_DIR: /data/optioner
      GATEWAY_URL: http://gateway:8081
      GATEWAY_TOKEN_FILE: /data/gateway/token
    volumes:
      - keeluni-data:/data
    networks: [internal]

volumes:
  keeluni-data:
    name: keeluni-data
  keeluni-pg:
    name: keeluni-pg
  postgres-secrets:
    name: keeluni-postgres-secrets

networks:
  internal:
